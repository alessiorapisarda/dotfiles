# Monitor
monitorrule=name:^HDMI-A-1$,width:3440,height:1440,refresh:175,x:0,y:0,vrr:0,hdr:0
allow_tearing=2

# Windows
windowrule=vrr_only_fullscreen:1,title:.*
windowrule=animation_type_open:zoom,title:Steam
windowrule=animation_type_close:zoom,title:Steam
windowrule=animation_type_open:zoom,title:Discord
windowrule=animation_type_close:zoom,title:Discord

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# layer rule
layerrule=animation_type_open:zoom,layer_name:vicinae
layerrule=animation_type_close:zoom,layer_name:vicinae
