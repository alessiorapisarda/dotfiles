background_blur    32
background_opacity 0.85

font_size       13.5

# BEGIN_KITTY_FONTS
font_family      family='Maple Mono NF CN' features='cv01=1 cv02=1 cv03=1 cv04=1 cv06=1 cv31=1 cv35=1 cv61=1 cv64=1 cv66=1'
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# BEGIN_KITTY_SYMBOL_MAPS
# symbol_map U+E000-U+F8FF,U+F0000-U+FFFFF,U+100000-U+10ffff JetBrainsMono Nerd Font
# END_KITTY_SYMBOL_MAPS

# Cursor Configuration
cursor_shape block
cursor_blink_interval 1

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
map ctrl+shift+n new_window

# Tab configuration
tab_bar_style powerline
tab_bar_align left

# Shell integration
shell_integration enabled
include themes/noctalia.conf
