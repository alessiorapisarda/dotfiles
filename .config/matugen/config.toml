[config]

[templates.alacritty]
input_path = "./templates/alacritty/alacritty.toml"
output_path = "~/.config/alacritty/themes/noctalia.toml"
post_hook = "bash ~/.config/matugen/templates/alacritty/apply.sh"
undo_hook = "bash ~/.config/matugen/templates/alacritty/undo.sh"

[templates.bat]
input_path = "./templates/bat/bat.tmTheme"
output_path = "~/.config/bat/themes/noctalia.tmTheme"
post_hook = "~/.config/matugen/templates/bat/apply.sh'"

[templates.btop]
input_path = "./templates/btop/btop.theme"
output_path = "~/.config/btop/themes/noctalia.theme"
post_hook = "bash ~/.config/matugen/templates/btop/apply.sh"
undo_hook = "bash ~/.config/matugen/templates/btop/undo.sh"

[templates.cava]
input_path = "./templates/cava/cava.ini"
output_path = "~/.config/cava/themes/noctalia"
post_hook = "bash ~/.config/matugen/templates/cava/apply.sh"
undo_hook = "bash ~/.config/matugen/templates/cava/undo.sh"

[templates.feishin]
input_path = "./templates/feishin/custom.css"
output_path = "~/.config/feishin/custom.css"

[templates.foot]
input_path = "./templates/foot/foot"
output_path = "~/.config/foot/themes/noctalia"
post_hook = "bash ~/.config/matugen/templates/foot/apply.sh"
undo_hook = "bash ~/.config/matugen/templates/foot/undo.sh"

[templates.fzf_bash]
input_path = "./templates/fzf/fzf.sh"
output_path = "~/.config/fzf/themes/noctalia.sh"

[templates.fzf_fish]
input_path = "./templates/fzf/fzf.fish"
output_path = "~/.config/fzf/themes/noctalia.fish"

[templates.ghostty]
input_path = "./templates/ghostty/ghostty"
output_path = "~/.config/ghostty/themes/noctalia"
post_hook = "bash ~/.config/matugen/templates/ghostty/apply.sh"
undo_hook = "bash ~/.config/matugen/templates/ghostty/undo.sh"

[templates.gtk3]
input_path = "./templates/gtk/gtk3.css"
output_path = "~/.config/gtk-3.0/noctalia.css"
post_hook = "bash ~/.config/matugen/templates/gtk/apply.sh {{ mode }}"
undo_hook = "bash ~/.config/matugen/templates/gtk/undo-gtk3.sh"

[templates.gtk4]
input_path = "./templates/gtk/gtk4.css"
output_path = "~/.config/gtk-4.0/noctalia.css"
post_hook = "bash ~/.config/matugen/templates/gtk/apply.sh {{ mode }}"
undo_hook = "bash ~/.config/matugen/templates/gtk/undo-gtk4.sh"

[templates.kcolorscheme]
input_path = "./templates/kde/kcolorscheme.colors"
output_path = "~/.config/color-schemes/noctalia.colors"
post_action = "kde-color-scheme"
undo_hook = "bash ~/.config/matugen/templates/kde/undo.sh'"

[templates.helix]
input_path = "./templates/helix/helix.toml"
output_path = "~/.config/helix/themes/noctalia.toml"
undo_hook = "bash ~/.config/matugen/templates/helix/undo.sh"

[templates.herdr]
input_path = "./templates/herdr/herdr-colors.toml"
output_path = "~/.config/herdr/matugen-colors.toml"
post_hook = "bash ~/.config/matugen/templates/herdr/apply.sh'"

[templates.kitty]
input_path = "./templates/kitty/kitty.conf"
output_path = "~/.config/kitty/themes/noctalia.conf"
post_hook = "bash ~/.config/matugen/templates/kitty/apply.sh"
undo_hook = "bash ~/.config/matugen/templates/kitty/undo.sh"

[templates.lazygit]
input_path = "./templates/lazygit/lazygit.yml"
output_path = "~/.config/lazygit/themes/noctalia.yml"
post_hook = "bash ~/.config/matugen/templates/lazygit/apply.sh'"

[templates.mango]
input_path = "./templates/mango/mango.conf"
output_path = "~/.config/mango/noctalia.conf"
post_hook = "bash ~/.config/matugen/templates/mango/apply.sh"
undo_hook = "bash ~/.config/matugen/templates/mango/undo.sh"

[templates.niri]
input_path = "./templates/niri/niri.kdl"
output_path_dynamic = "~/.config/matugen/templates/niri/apply.sh output"
post_hook = "bash ~/.config/matugen/templates/niri/apply.sh apply"
undo_hook = "bash ~/.config/matugen/templates/niri/undo.sh"

[templates.opencode]
input_path = "./templates/opencode/opencode.json"
output_path = "~/.config/opencode/themes/matugen.json"

[templates.pi-agent]
input_path = "./templates/pi-agent/pi-theme.json"
output_path = "~/.pi/agent/themes/noctalia.json"
post_hook = "bash ~/.config/matugen/templates/pi-agent/apply.sh"

[templates.qt]
input_path = "./templates/qt/qtct.conf"
output_path = ["~/.config/qt5ct/colors/noctalia.conf", "~/.config/qt6ct/colors/noctalia.conf"]
undo_hook = "bash ~/.config/matugen/templates/qt/undo.sh"

[templates.starship]
input_path = "./templates/starship/starship.toml"
output_path = "~/.config/starship.toml"
# post_hook = "bash ~/.config/matugen/templates/starship/apply.sh"
# undo_hook = "bash ~/.config/matugen/templates/starship/undo.sh"

[templates.vicinae]
input_path = "./templates/vicinae/vicinae.toml"
output_path = "~/.local/share/vicinae/themes/noctalia.toml"
post_hook = "bash ~/.config/matugen/templates/vicinae/apply.sh"

[templates.yazi]
input_path = "./templates/yazi/yazi.toml"
output_path = "~/.config/yazi/flavors/noctalia.yazi/flavor.toml"
post_hook = "bash ~/.config/matugen/templates/yazi/apply.sh"

[templates.zathura]
input_path = "./templates/zathura/zathurarc"
output_path = "~/.config/zathura/noctaliarc"
post_hook = "bash ~/.config/matugen/templates/zathura/apply.sh"

